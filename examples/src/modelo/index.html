<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Sin cache del index: si no, el navegador se queda con hashes viejos y
         da 404 al desplegar. Mismo motivo que en /workspace/. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" href="/img/favicon.ico" type="image/x-icon" />
    <title>Hekatan Struct — Modelo</title>
    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }
      body { padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); }
    </style>
  </head>
  <body>
    <!-- OJO: NO poner un sello de version a mano en el src. Ese texto no cambia
         al editar main.ts y el navegador se queda con el modulo cacheado para
         siempre. Vite ya versiona en dev y pone hash en el build. -->
    <script type="module" src="./main.ts"></script>
  </body>
</html>
