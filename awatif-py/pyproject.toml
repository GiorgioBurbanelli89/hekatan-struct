[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awatif-py"
version = "0.1.0"
description = "Parametric structural FEM in pure Python — Python port of awatif v2 with frames, shells, modal, Winkler, PyVista 3D viewer and ipywidgets sliders"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "GiorgioBurbanelli89", email = "jbjazzjuventus1989@gmail.com" },
]
keywords = ["fem", "structural", "engineering", "awatif", "parametric", "static", "modal"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.20",
  "scipy>=1.7",
]

[project.optional-dependencies]
viewer = ["pyvista>=0.42", "matplotlib>=3.5"]
sliders = ["ipywidgets>=8.0", "trame>=3.0", "trame-vuetify>=2.0", "trame-vtk>=2.0"]
all = [
  "awatif-py[viewer,sliders]",
]
dev = [
  "pytest>=7",
  "pytest-cov>=4",
  "black>=23",
  "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/GiorgioBurbanelli89/hekatan-struct"
Repository = "https://github.com/GiorgioBurbanelli89/hekatan-struct"
Documentation = "https://github.com/GiorgioBurbanelli89/hekatan-struct/tree/main/awatif-py"
"Bug Tracker" = "https://github.com/GiorgioBurbanelli89/hekatan-struct/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/awatif"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "validation: cross-validation tests against ETABS/SAP2000/OpenSees reference",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.black]
line-length = 100
target-version = ["py39"]
